<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop OS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; overflow: hidden; background: #0f172a; }
.desktop-area { height: 100vh; width: 100%; position: relative; background: linear-gradient(135deg,#1a1a2e,#16213e); }
.taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 48px; z-index: 100; background: rgba(20,20,30,0.85); backdrop-filter: blur(16px); display: flex; align-items: center; padding: 0 8px; gap: 4px; }
.start-btn { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; background: rgba(255,255,255,0.08); }
.start-menu { position: absolute; bottom: 56px; left: 8px; width: 260px; max-height: 400px; border-radius: 12px; padding: 16px; z-index: 200; background: rgba(20,20,30,0.95); backdrop-filter: blur(20px); display: none; }
.start-menu.open { display: block; }
.app-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 13px; }
.app-item:hover { background: rgba(255,255,255,0.1); }
.os-window { position: absolute; border-radius: 10px; overflow: hidden; min-width: 260px; min-height: 180px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); display: flex; flex-direction: column; z-index: 50; background: #0f172a; }
.os-window.minimized { display: none; }
.win-titlebar { height: 34px; display: flex; align-items: center; padding: 0 10px; background: #1e293b; color: #fff; flex-shrink: 0; }
.win-titlebar span { flex: 1; font-size: 13px; font-weight: 500; }
.win-btn { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; margin-left: 6px; }
.win-body { flex: 1; overflow: auto; color: #e2e8f0; }
.terminal-body { background: #1a1a2e; color: #0f0; font-family: monospace; font-size: 13px; padding: 12px; height: 100%; display: flex; flex-direction: column; }
.terminal-output { flex: 1; overflow-y: auto; white-space: pre-wrap; }
.taskbar-app { height: 34px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 12px; border: none; color: #fff; background: rgba(255,255,255,0.08); }
.clock { margin-left: auto; font-size: 13px; color: #ccc; padding-right: 8px; }
.desktop-icon { position: absolute; width: 68px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px; border-radius: 8px; text-align: center; }
.desktop-icon .ic { width: 30px; height: 30px; border-radius: 6px; }
.desktop-icon span { font-size: 10px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.store-grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px; }
.store-card { width: 130px; background: #1e293b; border-radius: 10px; padding: 10px; text-align: center; }
.store-card .ic { width: 40px; height: 40px; border-radius: 8px; margin: 0 auto 6px; }
.store-card p { font-size: 12px; margin-bottom: 8px; }
.install-btn { font-size: 11px; padding: 5px 10px; border-radius: 6px; border: none; background: #22c55e; color: #fff; cursor: pointer; }
.install-btn[disabled] { background: #475569; }
</style>
</head>
<body class="desktop-area">

<div class="desktop-icon" style="top:16px;left:16px" onclick="openWindow('terminal')">
  <div class="ic" style="background:#0f172a;display:flex;align-items:center;justify-content:center;color:#0f0;font-size:16px;">&gt;_</div>
  <span>Terminal</span>
</div>
<div class="desktop-icon" style="top:16px;left:92px" onclick="openWindow('notepad')">
  <div class="ic" style="background:#334155;display:flex;align-items:center;justify-content:center;color:#93c5fd;font-size:16px;">📝</div>
  <span>Notas</span>
</div>
<div class="desktop-icon" style="top:16px;left:168px" onclick="openWindow('files')">
  <div class="ic" style="background:#334155;display:flex;align-items:center;justify-content:center;color:#f59e0b;font-size:16px;">📁</div>
  <span>Arquivos</span>
</div>
<div class="desktop-icon" style="top:16px;left:244px" onclick="openWindow('store')">
  <div class="ic" style="background:#334155;display:flex;align-items:center;justify-content:center;color:#a78bfa;font-size:16px;">🛒</div>
  <span>Loja</span>
</div>
<div id="dynamicIcons"></div>

<div class="start-menu" id="startMenu">
  <p style="font-size:11px;color:#aaa;margin-bottom:10px;">APLICATIVOS</p>
  <div class="app-item" onclick="openWindow('terminal')">🖥️ Terminal</div>
  <div class="app-item" onclick="openWindow('notepad')">📝 Notas</div>
  <div class="app-item" onclick="openWindow('files')">📁 Arquivos</div>
  <div class="app-item" onclick="openWindow('store')">🛒 Loja de Apps</div>
</div>

<div class="taskbar">
  <button class="start-btn" onclick="toggleStart()">🪟</button>
  <div id="taskbarApps" style="display:flex;gap:4px;"></div>
  <div class="clock" id="clock"></div>
</div>

<div id="win-terminal" class="os-window minimized" style="top:50px;left:60px;width:420px;height:260px;">
  <div class="win-titlebar"><span>Terminal</span>
    <button class="win-btn" style="background:#f59e0b" onclick="minimizeWin('terminal')"></button>
    <button class="win-btn" style="background:#ef4444" onclick="closeWin('terminal')"></button>
  </div>
  <div class="win-body terminal-body">
    <div class="terminal-output" id="termOutput">user@desktop:~$ Digite "help"\n</div>
    <div style="display:flex;gap:4px;"><span style="color:#0f0">$</span>
      <input id="termInput" style="background:transparent;border:none;color:#0f0;flex:1;outline:none;font-family:monospace;" onkeydown="if(event.key==='Enter')runCmd()">
    </div>
  </div>
</div>

<div id="win-notepad" class="os-window minimized" style="top:70px;left:150px;width:360px;height:240px;">
  <div class="win-titlebar"><span>Notas</span>
    <button class="win-btn" style="background:#f59e0b" onclick="minimizeWin('notepad')"></button>
    <button class="win-btn" style="background:#ef4444" onclick="closeWin('notepad')"></button>
  </div>
  <div class="win-body"><textarea style="width:100%;height:100%;background:transparent;color:#e2e8f0;border:none;padding:10px;outline:none;" placeholder="Escreva algo..."></textarea></div>
</div>

<div id="win-files" class="os-window minimized" style="top:90px;left:110px;width:340px;height:220px;">
  <div class="win-titlebar"><span>Arquivos</span>
    <button class="win-btn" style="background:#f59e0b" onclick="minimizeWin('files')"></button>
    <button class="win-btn" style="background:#ef4444" onclick="closeWin('files')"></button>
  </div>
  <div class="win-body" style="padding:12px;display:flex;gap:16px;flex-wrap:wrap;">
    <div style="text-align:center">📁<p style="font-size:11px">Documentos</p></div>
    <div style="text-align:center">📁<p style="font-size:11px">Downloads</p></div>
    <div style="text-align:center">🖼️<p style="font-size:11px">Imagens</p></div>
  </div>
</div>

<div id="win-store" class="os-window minimized" style="top:40px;left:100px;width:420px;height:300px;">
  <div class="win-titlebar"><span>Loja de Apps</span>
    <button class="win-btn" style="background:#f59e0b" onclick="minimizeWin('store')"></button>
    <button class="win-btn" style="background:#ef4444" onclick="closeWin('store')"></button>
  </div>
  <div class="win-body">
    <div class="store-grid" id="storeGrid"></div>
  </div>
</div>

<script>
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
updateClock();setInterval(updateClock,1000);

const openWindows=new Set();
function openWindow(id){document.getElementById('win-'+id).classList.remove('minimized');openWindows.add(id);updateTaskbar();document.getElementById('startMenu').classList.remove('open');}
function closeWin(id){document.getElementById('win-'+id).classList.add('minimized');openWindows.delete(id);updateTaskbar();}
function minimizeWin(id){document.getElementById('win-'+id).classList.add('minimized');updateTaskbar();}
function updateTaskbar(){
  const c=document.getElementById('taskbarApps');c.innerHTML='';
  openWindows.forEach(id=>{
    const b=document.createElement('button');
    b.className='taskbar-app';
    b.textContent=id.charAt(0).toUpperCase()+id.slice(1);
    b.onclick=()=>{document.getElementById('win-'+id).classList.remove('minimized');};
    c.appendChild(b);
  });
}
function toggleStart(){document.getElementById('startMenu').classList.toggle('open');}

function runCmd(){
  const inp=document.getElementById('termInput');const out=document.getElementById('termOutput');
  const cmd=inp.value.trim();inp.value='';
  out.textContent+='$ '+cmd+'\n';
  if(cmd==='help')out.textContent+='Comandos: help, date, clear, whoami, uname\n';
  else if(cmd==='date')out.textContent+=new Date().toLocaleString('pt-BR')+'\n';
  else if(cmd==='clear')out.textContent='';
  else if(cmd==='whoami')out.textContent+='user\n';
  else if(cmd==='uname')out.textContent+='DesktopOS 1.0 (Linux/Windows Hybrid)\n';
  else if(cmd)out.textContent+='comando não encontrado: '+cmd+'\n';
  out.scrollTop=out.scrollHeight;
}

const storeApps=[
  {id:'calc',name:'Calculadora',emoji:'🧮'},
  {id:'browser',name:'Navegador',emoji:'🌐'},
  {id:'music',name:'Música',emoji:'🎵'},
  {id:'paint',name:'Paint',emoji:'🎨'},
  {id:'clock',name:'Relógio',emoji:'⏰'},
  {id:'photos',name:'Fotos',emoji:'🖼️'}
];
const installed=new Set();
function renderStore(){
  const g=document.getElementById('storeGrid');g.innerHTML='';
  storeApps.forEach(app=>{
    const card=document.createElement('div');card.className='store-card';
    const isInstalled=installed.has(app.id);
    card.innerHTML=`<div class="ic" style="background:#334155;display:flex;align-items:center;justify-content:center;font-size:20px;">${app.emoji}</div>
      <p>${app.name}</p>
      <button class="install-btn" ${isInstalled?'disabled':''} onclick="installApp('${app.id}')">${isInstalled?'Instalado':'Instalar'}</button>`;
    g.appendChild(card);
  });
}
function installApp(id){
  installed.add(id);
  renderStore();
  addDesktopIcon(id);
}
function addDesktopIcon(id){
  const app=storeApps.find(a=>a.id===id);
  const div=document.createElement('div');
  const top=16+((installed.size-1)*76);
  div.className='desktop-icon';
  div.style.top=top+'px';div.style.left='320px';
  div.innerHTML=`<div class="ic" style="background:#334155;display:flex;align-items:center;justify-content:center;font-size:16px;">${app.emoji}</div><span>${app.name}</span>`;
  document.getElementById('dynamicIcons').appendChild(div);
}
renderStore();
</script>
</body>
  </html>

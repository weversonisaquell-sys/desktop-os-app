  <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; overflow: hidden; }
        .desktop-area { height: calc(100 * min(var(--vh, 1vh), 1vh)); width: 100%; position: relative; }
        .wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 48px; z-index: 100; backdrop-filter: blur(16px); display: flex; align-items: center; padding: 0 8px; gap: 4px; }
        .start-btn { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s; border: none; }
        .start-btn:hover { filter: brightness(1.2); }
        .start-menu { position: absolute; bottom: 56px; left: 8px; width: 320px; max-height: 400px; border-radius: 12px; padding: 16px; z-index: 200; backdrop-filter: blur(20px); display: none; }
        .start-menu.open { display: block; }
        .app-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background 0.12s; }
        .app-item:hover { background: rgba(255,255,255,0.1); }
        .os-window { position: absolute; border-radius: 10px; overflow: hidden; min-width: 300px; min-height: 200px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); display: flex; flex-direction: column; z-index: 50; }
        .os-window.minimized { display: none; }
        .win-titlebar { height: 36px; display: flex; align-items: center; padding: 0 10px; cursor: grab; user-select: none; flex-shrink: 0; }
        .win-titlebar span { flex: 1; font-size: 13px; font-weight: 500; }
        .win-btn { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; margin-left: 6px; }
        .win-body { flex: 1; overflow: auto; }
        .terminal-body { background: #1a1a2e; color: #0f0; font-family: 'Space Mono', monospace; font-size: 13px; padding: 12px; height: 100%; display: flex; flex-direction: column; }
        .terminal-output { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .terminal-input { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
        .terminal-input input { background: transparent; border: none; color: #0f0; font-family: inherit; font-size: inherit; flex: 1; outline: none; }
        .taskbar-app { height: 36px; padding: 0 12px; border-radius: 6px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; border: none; color: #fff; background: rgba(255,255,255,0.08); }
        .taskbar-app.active { background: rgba(255,255,255,0.18); }
        .clock { margin-left: auto; font-size: 13px; color: #ccc; padding-right: 8px; }
        .desktop-icon { position: absolute; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px; border-radius: 8px; text-align: center; }
        .desktop-icon:hover { background: rgba(255,255,255,0.1); }
        .desktop-icon span { font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    </style>

  <script src="/_sdk/6e31def43ecdfeab.editing_sdk.js" integrity="sha512-dLsCmEXoPwwgpykZ4cBcMyQIrP+91IJR9KNOwXo5DW+WeKKF+Uo/SerDyq8ysa/BlG5uxbgAtmcz7kiob0VKYA=="></script>
  <script>
        lucide.createIcons();

        // Clock
        function updateClock(){
            const d=new Date();
            document.getElementById('clock').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        }
        updateClock();setInterval(updateClock,1000);

        // Window management
        const openWindows=new Set();
        function openWindow(id){
            document.getElementById('win-'+id).classList.remove('minimized');
            openWindows.add(id);
            bringToFront('win-'+id);
            updateTaskbar();
            document.getElementById('startMenu').classList.remove('open');
        }
        function closeWin(id){document.getElementById('win-'+id).classList.add('minimized');openWindows.delete(id);updateTaskbar();}
        function minimizeWin(id){document.getElementById('win-'+id).classList.add('minimized');updateTaskbar();}
        let zIdx=50;
        function bringToFront(elId){document.getElementById(elId).style.zIndex=++zIdx;}

        function updateTaskbar(){
            const c=document.getElementById('taskbarApps');
            c.innerHTML='';
            openWindows.forEach(id=>{
                const b=document.createElement('button');
                b.className='taskbar-app'+(document.getElementById('win-'+id).classList.contains('minimized')?'':' active');
                b.textContent=id.charAt(0).toUpperCase()+id.slice(1);
                b.onclick=()=>{const w=document.getElementById('win-'+id);if(w.classList.contains('minimized')){w.classList.remove('minimized');}bringToFront('win-'+id);updateTaskbar();};
                c.appendChild(b);
            });
        }

        // Drag
        let dragEl=null,dx=0,dy=0;
        function startDrag(e,id){dragEl=document.getElementById(id);dx=e.clientX-dragEl.offsetLeft;dy=e.clientY-dragEl.offsetTop;bringToFront(id);document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',()=>{dragEl=null;document.removeEventListener('mousemove',onDrag);});}
        function onDrag(e){if(!dragEl)return;dragEl.style.left=(e.clientX-dx)+'px';dragEl.style.top=(e.clientY-dy)+'px';}

        // Start menu
        function toggleStart(){document.getElementById('startMenu').classList.toggle('open');}
        document.addEventListener('click',e=>{if(!e.target.closest('.start-btn')&&!e.target.closest('.start-menu'))document.getElementById('startMenu').classList.remove('open');});

        // Terminal
        function runCmd(){
            const inp=document.getElementById('termInput');const out=document.getElementById('termOutput');
            const cmd=inp.value.trim();inp.value='';
            out.textContent+='$ '+cmd+'\n';
            if(cmd==='help')out.textContent+='Comandos: help, date, clear, echo <msg>, whoami, uname\n';
            else if(cmd==='date')out.textContent+=new Date().toLocaleString('pt-BR')+'\n';
            else if(cmd==='clear')out.textContent='';
            else if(cmd.startsWith('echo '))out.textContent+=cmd.slice(5)+'\n';
            else if(cmd==='whoami')out.textContent+='user\n';
            else if(cmd==='uname')out.textContent+='DesktopOS 1.0 (Linux/Windows Hybrid)\n';
            else if(cmd)out.textContent+='comando não encontrado: '+cmd+'\n';
            out.scrollTop=out.scrollHeight;
        }
    </script>

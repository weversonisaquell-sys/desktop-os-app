<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Desktop OS Mobile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --glass:rgba(12,18,30,.72);--glass2:rgba(24,32,50,.86);--line:rgba(255,255,255,.12);
  --text:#f7f8fc;--muted:#aab3c5;--accent:#6c7cff;--accent2:#9d6cff;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#080b13;color:var(--text)}
button,input,textarea{font:inherit}
button{color:inherit}
#desktop{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 20% 10%,#293a79 0,#101a39 28%,#080b13 72%)}
.wallpaper{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}
.overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(8,12,25,.18),rgba(8,10,18,.55))}
#icons{position:absolute;top:18px;left:12px;display:grid;grid-template-columns:repeat(4,72px);gap:12px 8px}
.icon{width:72px;padding:8px 4px;border:0;background:transparent;border-radius:14px;text-align:center;cursor:pointer}
.icon:active{background:rgba(255,255,255,.12);transform:scale(.96)}
.icon .ico{width:48px;height:48px;margin:auto;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#3346a4,#141b38);box-shadow:0 8px 22px #0007}
.icon span{display:block;margin-top:5px;font-size:11px;text-shadow:0 2px 5px #000}
#taskbar{position:absolute;z-index:900;left:8px;right:8px;bottom:8px;height:58px;border:1px solid var(--line);border-radius:20px;background:rgba(13,18,31,.72);backdrop-filter:blur(24px);display:flex;align-items:center;padding:6px;gap:6px;box-shadow:0 12px 40px #0008}
#start{width:46px;height:46px;border:0;border-radius:15px;background:linear-gradient(145deg,#6878ff,#8d5cff);font-size:23px;cursor:pointer}
#taskapps{display:flex;gap:5px;overflow:auto}
.task{height:44px;border:1px solid transparent;background:rgba(255,255,255,.07);border-radius:13px;padding:0 12px;cursor:pointer;white-space:nowrap}
.task.active{background:rgba(108,124,255,.28);border-color:rgba(140,150,255,.35)}
#clock{margin-left:auto;padding:0 10px;text-align:right;font-size:12px;color:#dce2ef}
#startMenu{position:absolute;z-index:1000;left:8px;bottom:74px;width:min(390px,calc(100vw - 16px));height:min(590px,calc(100vh - 90px));display:none;overflow:hidden;border:1px solid var(--line);border-radius:26px;background:rgba(10,15,27,.9);backdrop-filter:blur(30px);box-shadow:0 24px 80px #0009}
#startMenu.open{display:block}
.startTop{padding:20px 20px 12px}
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.07);color:white;padding:0 14px;outline:none}
.startBody{padding:8px 16px;overflow:auto;height:calc(100% - 80px)}
.sectionTitle{font-size:11px;color:var(--muted);letter-spacing:.12em;margin:15px 5px 9px}
.appsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.appTile{border:0;background:rgba(255,255,255,.055);border-radius:15px;padding:10px 4px;cursor:pointer}
.appTile:active{transform:scale(.97)}
.appTile b{display:block;font-size:10px;margin-top:5px;font-weight:500}
.smallIco{width:38px;height:38px;border-radius:12px;margin:auto;display:grid;place-items:center;font-size:19px;background:linear-gradient(145deg,#293b8e,#151a32)}
#windows{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;z-index:100;pointer-events:auto;min-width:280px;min-height:190px;width:430px;height:310px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(12,17,29,.92);backdrop-filter:blur(24px);box-shadow:0 22px 70px #0009;display:flex;flex-direction:column}
.win.hidden{display:none}
.title{height:44px;display:flex;align-items:center;user-select:none;padding:0 12px;background:rgba(255,255,255,.055);border-bottom:1px solid var(--line);touch-action:none;cursor:grab}
.title strong{font-size:13px;flex:1}
.wbtn{width:28px;height:28px;border:0;border-radius:9px;background:rgba(255,255,255,.08);margin-left:5px;cursor:pointer}
.wbtn.close{background:#b73545}
.body{flex:1;overflow:auto}
.terminal{height:100%;padding:13px;background:#080b11;color:#65ff9a;font:12px ui-monospace,monospace;display:flex;flex-direction:column}
.termout{flex:1;overflow:auto;white-space:pre-wrap}
.termin{display:flex;gap:6px}.termin input{flex:1;background:none;border:0;outline:0;color:#65ff9a}
.editor{width:100%;height:100%;resize:none;border:0;outline:0;background:#0b1020;color:#e8ecf7;padding:15px;font:13px ui-monospace,monospace}
.files{padding:15px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.file{padding:14px 8px;text-align:center;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.04);cursor:pointer}
.file div{font-size:30px}.file small{color:var(--muted)}
.about{height:100%;display:grid;place-items:center;text-align:center;padding:30px}
.about .logo{font-size:52px;margin-bottom:10px}
.store{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#101831,#0b1020)}
.storeHead{padding:18px;background:linear-gradient(135deg,#273a9c,#663da3)}
.storeHead h2{font-size:24px}.storeHead p{color:#d9def8;font-size:12px;margin:4px 0 14px}
.storeSearch{height:42px;width:100%;border:0;border-radius:13px;padding:0 13px;background:#ffffff18;color:white;outline:0}
.storeTabs{display:flex;gap:7px;padding:10px;overflow:auto}.tab{border:0;border-radius:12px;padding:9px 13px;background:#ffffff0b;color:#bfc7dc;white-space:nowrap}.tab.active{background:#6d7dff;color:white}
.storeGrid{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:auto}
.card{border:1px solid var(--line);border-radius:17px;background:#ffffff08;padding:11px}
.cardIcon{height:76px;border-radius:15px;display:grid;place-items:center;font-size:36px;background:linear-gradient(145deg,#263a91,#171c37);margin-bottom:9px}
.card h3{font-size:13px}.card p{font-size:10px;color:var(--muted);height:29px;overflow:hidden;margin:3px 0 9px}
.card button{width:100%;height:33px;border:0;border-radius:10px;background:linear-gradient(90deg,#6577ff,#8d60ff);font-weight:700;font-size:11px;cursor:pointer}
#toast{position:absolute;z-index:3000;left:50%;bottom:82px;transform:translateX(-50%) translateY(20px);opacity:0;background:#101725eF;border:1px solid var(--line);padding:11px 16px;border-radius:13px;font-size:12px;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){
  #icons{grid-template-columns:repeat(4,65px);gap:8px 5px}
  .icon{width:65px}
  .win{left:5%!important;top:7%!important;width:90%!important;height:76%!important;min-width:0}
  #startMenu{height:72vh}
}
</style>
</head>
<body>
<div id="desktop">
  <div class="wallpaper"></div><div class="overlay"></div>
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="startMenu">
    <div class="startTop"><input id="appSearch" class="search" placeholder="Pesquisar aplicativos..." oninput="filterStart()"></div>
    <div class="startBody"><div class="sectionTitle">APLICATIVOS</div><div id="startApps" class="appsGrid"></div></div>
  </div>
  <div id="taskbar"><button id="start" onclick="toggleStart()">◈</button><div id="taskapps"></div><div id="clock"></div></div>
  <div id="toast"></div>
</div>

<script>
const apps=[
 {id:'store',name:'Loja',icon:'🛍️',desc:'Baixe aplicativos para o seu Desktop OS',cat:'Destaques'},
 {id:'terminal',name:'Terminal',icon:'⌘',desc:'Console de comandos',cat:'Sistema'},
 {id:'notepad',name:'Notas',icon:'📝',desc:'Editor de texto rápido',cat:'Produtividade'},
 {id:'files',name:'Arquivos',icon:'📁',desc:'Gerenciador de arquivos',cat:'Sistema'},
 {id:'browser',name:'Navegador',icon:'🌐',desc:'Navegador web',cat:'Internet'},
 {id:'calculator',name:'Calculadora',icon:'🧮',desc:'Cálculos rápidos',cat:'Produtividade'},
 {id:'settings',name:'Configurações',icon:'⚙️',desc:'Personalize o sistema',cat:'Sistema'},
 {id:'about',name:'Sobre',icon:'◉',desc:'Informações do sistema',cat:'Sistema'}
];
const storeApps=[
 {id:'music',name:'Music Player',icon:'🎵',desc:'Reprodutor de música',cat:'Música'},
 {id:'gallery',name:'Galeria',icon:'🖼️',desc:'Visualizador de imagens',cat:'Multimídia'},
 {id:'weather',name:'Clima',icon:'☀️',desc:'Previsão do tempo',cat:'Utilidades'},
 {id:'notespro',name:'Notes Pro',icon:'📒',desc:'Notas avançadas',cat:'Produtividade'},
 {id:'games',name:'Game Hub',icon:'🎮',desc:'Central de jogos',cat:'Jogos'},
 {id:'clockapp',name:'Relógio',icon:'⏱️',desc:'Relógio e cronômetro',cat:'Utilidades'},
 {id:'paint',name:'Paint',icon:'🎨',desc:'Desenho simples',cat:'Criatividade'},
 {id:'calculator2',name:'Calc+',icon:'➗',desc:'Calculadora avançada',cat:'Produtividade'}
];
let installed=JSON.parse(localStorage.getItem('dos_installed')||'[]');
let open=new Set(), z=1000;

function allApps(){return apps.concat(storeApps.filter(a=>installed.includes(a.id)))}
function iconHTML(a,small=false){return `<div class="${small?'smallIco':'ico'}">${a.icon}</div>`}
function renderDesktop(){
 const c=document.getElementById('icons'); c.innerHTML='';
 const desktopApps=[...apps.filter(a=>['store','terminal','notepad','files','browser','settings'].includes(a.id)),
   ...storeApps.filter(a=>installed.includes(a.id))];
 desktopApps.forEach((a,i)=>{
   const row=Math.floor(i/4), col=(i%4)+1;
   c.innerHTML+=`<button class="icon" style="grid-column:${col};grid-row:${row+1}" onclick="openApp('${a.id}')">${iconHTML(a)}<span>${a.name}</span></button>`;
 });
}
function renderStart(list=allApps()){
 const c=document.getElementById('startApps');c.innerHTML='';
 list.forEach(a=>c.innerHTML+=`<button class="appTile" onclick="openApp('${a.id}')">${iconHTML(a,true)}<b>${a.name}</b></button>`);
}
function filterStart(){const q=document.getElementById('appSearch').value.toLowerCase();renderStart(allApps().filter(a=>a.name.toLowerCase().includes(q)))}
function toggleStart(){document.getElementById('startMenu').classList.toggle('open');if(document.getElementById('startMenu').classList.contains('open'))renderStart()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function openApp(id){
 document.getElementById('startMenu').classList.remove('open');
 if(id==='store')return openStore();
 if(document.getElementById('win-'+id)){showWin(id);return}
 createWindow(id);showWin(id);
}
function createWindow(id){
 const a=allApps().find(x=>x.id===id)||{id,name:id,icon:'◉'};
 let content='';
 if(id==='terminal')content=`<div class="terminal"><div class="termout" id="out-${id}">DesktopOS Terminal\nDigite "help" para ver os comandos.\n\n</div><div class="termin"><span>$</span><input id="in-${id}" onkeydown="if(event.key==='Enter')cmd('${id}')"></div></div>`;
 else if(id==='notepad'||id==='notespro')content=`<textarea class="editor" placeholder="Digite suas anotações..."></textarea>`;
 else if(id==='files')content=`<div class="files">${[['📁','Documentos'],['📥','Downloads'],['🖼️','Imagens'],['🎵','Músicas'],['🎬','Vídeos'],['📦','Aplicativos']].map(x=>`<div class="file" onclick="toast('${x[1]} aberto')"><div>${x[0]}</div><small>${x[1]}</small></div>`).join('')}</div>`;
 else if(id==='calculator'||id==='calculator2')content=`<div style="padding:20px"><input id="calc-${id}" style="width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:#0003;color:white;padding:10px;font-size:20px;text-align:right"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px">${'789/456*123-0.+='.split('').map(x=>`<button style="height:48px;border:0;border-radius:12px;background:#ffffff0b" onclick="calc('${id}','${x}')">${x}</button>`).join('')}</div></div>`;
 else if(id==='browser')content=`<div style="height:100%;padding:14px;background:#f4f6fb;color:#151927"><div style="background:white;border-radius:12px;padding:10px;margin-bottom:10px;color:#555">Navegador Desktop OS</div><div style="padding:25px;text-align:center"><h2>Bem-vindo</h2><p style="margin-top:8px;color:#667">Digite um endereço na barra para começar.</p></div></div>`;
 else if(id==='settings')content=`<div style="padding:18px"><h2 style="font-size:18px">Configurações</h2><p style="color:var(--muted);font-size:12px;margin:5px 0 18px">Personalização do sistema</p><button onclick="toggleTheme()" style="width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;text-align:left">Alternar aparência</button><button onclick="toast('Dados locais preservados')" style="width:100%;padding:14px;margin-top:8px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;text-align:left">Armazenamento local</button></div>`;
 else if(id==='about')content=`<div class="about"><div><div class="logo">◈</div><h2>Desktop OS</h2><p style="color:var(--muted);margin-top:6px">Sistema desktop mobile completo<br>com multitarefa e loja de aplicativos.</p><small style="display:block;margin-top:14px;color:#78839a">Versão 2.0</small></div></div>`;
 else if(id==='music')content=`<div class="about"><div><div class="logo">🎵</div><h2>Music Player</h2><p style="color:var(--muted);margin-top:6px">Seu reprodutor de música.</p><button onclick="toast('Selecione um arquivo de áudio do dispositivo')" style="margin-top:18px;padding:11px 15px;border:0;border-radius:11px;background:var(--accent)">Adicionar música</button></div></div>`;
 else content=`<div class="about"><div><div class="logo">${a.icon}</div><h2>${a.name}</h2><p style="color:var(--muted);margin-top:6px">${a.desc}</p><button onclick="toast('${a.name} iniciado')" style="margin-top:18px;padding:11px 15px;border:0;border-radius:11px;background:var(--accent)">Abrir aplicativo</button></div></div>`;
 const w=document.createElement('div');w.className='win hidden';w.id='win-'+id;w.style.left=(70+Math.random()*90)+'px';w.style.top=(45+Math.random()*70)+'px';
 w.innerHTML=`<div class="title" id="title-${id}"><strong>${a.icon||'◉'} ${a.name||id}</strong><button class="wbtn" onclick="minWin('${id}')">−</button><button class="wbtn close" onclick="closeWin('${id}')">×</button></div><div class="body">${content}</div>`;
 document.getElementById('windows').appendChild(w);makeDrag(w,w.querySelector('.title'));lucideSafe();
}
function showWin(id){const w=document.getElementById('win-'+id);w.classList.remove('hidden');w.style.zIndex=++z;open.add(id);renderTasks()}
function minWin(id){document.getElementById('win-'+id).classList.add('hidden');renderTasks()}
function closeWin(id){document.getElementById('win-'+id)?.remove();open.delete(id);renderTasks()}
function renderTasks(){const c=document.getElementById('taskapps');c.innerHTML='';open.forEach(id=>{const a=allApps().find(x=>x.id===id);if(!a)return;c.innerHTML+=`<button class="task ${!document.getElementById('win-'+id).classList.contains('hidden')?'active':''}" onclick="showWin('${id}')">${a.icon} ${a.name}</button>`})}
function makeDrag(w,h){
 let dragging=false,ox=0,oy=0;
 const start=(e)=>{
   if(e.target.closest('button,input,textarea,select,a')) return;
   dragging=true; w.style.zIndex=++z;
   const p=e.touches?e.touches[0]:e;
   ox=p.clientX-w.offsetLeft; oy=p.clientY-w.offsetTop;
   if(e.preventDefault)e.preventDefault();
 };
 const move=(e)=>{
   if(!dragging)return;
   const p=e.touches?e.touches[0]:e;
   const maxX=Math.max(0,innerWidth-w.offsetWidth);
   const maxY=Math.max(0,innerHeight-w.offsetHeight-8);
   w.style.left=Math.max(0,Math.min(maxX,p.clientX-ox))+'px';
   w.style.top=Math.max(0,Math.min(maxY,p.clientY-oy))+'px';
   if(e.preventDefault)e.preventDefault();
 };
 const end=()=>dragging=false;
 h.addEventListener('mousedown',start);
 h.addEventListener('touchstart',start,{passive:false});
 addEventListener('mousemove',move);
 addEventListener('touchmove',move,{passive:false});
 addEventListener('mouseup',end);
 addEventListener('touchend',end);
}
function openStore(){
 if(!document.getElementById('win-store'))createStore();
 showWin('store');
}
function createStore(){
 const w=document.createElement('div');w.className='win hidden';w.id='win-store';w.style.left='5%';w.style.top='5%';w.style.width='90%';w.style.height='82%';
 w.innerHTML=`<div class="title"><strong>🛍️ Loja de Apps</strong><button class="wbtn" onclick="minWin('store')">−</button><button class="wbtn close" onclick="closeWin('store')">×</button></div><div class="body"><div class="store"><div class="storeHead"><h2>Loja de Apps</h2><p>Descubra aplicativos para o seu Desktop OS</p><input id="storeSearch" class="storeSearch" placeholder="Pesquisar na loja..." oninput="renderStore()"></div><div class="storeTabs"><button class="tab active" onclick="setCat('Todos',this)">Todos</button><button class="tab" onclick="setCat('Produtividade',this)">Produtividade</button><button class="tab" onclick="setCat('Multimídia',this)">Multimídia</button><button class="tab" onclick="setCat('Jogos',this)">Jogos</button><button class="tab" onclick="setCat('Utilidades',this)">Utilidades</button></div><div id="storeGrid" class="storeGrid"></div></div></div>`;
 document.getElementById('windows').appendChild(w);makeDrag(w,w.querySelector('.title'));renderStore();
}
let cat='Todos';
function setCat(c,e){cat=c;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');renderStore()}
function renderStore(){
 const q=(document.getElementById('storeSearch')?.value||'').toLowerCase();
 const list=storeApps.filter(a=>(cat==='Todos'||a.cat===cat)&&a.name.toLowerCase().includes(q));
 document.getElementById('storeGrid').innerHTML=list.map(a=>`<div class="card"><div class="cardIcon">${a.icon}</div><h3>${a.name}</h3><p>${a.desc}</p><button onclick="installApp('${a.id}')">${installed.includes(a.id)?'ABRIR':'INSTALAR'}</button></div>`).join('');
}
function installApp(id){
 if(!installed.includes(id)){
   installed.push(id);
   localStorage.setItem('dos_installed',JSON.stringify(installed));
   renderDesktop();
   renderStart();
   toast('Aplicativo instalado e adicionado à tela inicial');
 }else{
   openApp(id);
 }
 renderStore();
}
function cmd(id){
 const input=document.getElementById('in-'+id),out=document.getElementById('out-'+id),c=input.value.trim();input.value='';
 out.textContent+='$ '+c+'\n';
 const cmds={help:'Comandos: help, date, clear, echo, whoami, apps, store',whoami:'user',uname:'DesktopOS Mobile 2.0',apps:allApps().map(a=>a.name).join(', '),store:'Use o aplicativo Loja para instalar apps.'};
 if(c==='clear')out.textContent='';else if(c==='date')out.textContent+=new Date().toLocaleString('pt-BR')+'\n';else if(c.startsWith('echo '))out.textContent+=c.slice(5)+'\n';else out.textContent+=(cmds[c]||'comando não encontrado: '+c)+'\n';out.scrollTop=out.scrollHeight;
}
function calc(id,x){const e=document.getElementById('calc-'+id);if(x==='='){try{e.value=Function('return '+e.value.replace(/[^0-9+*/().-]/g,''))()}catch{e.value='Erro'}}else if(x==='.'||/[0-9]/.test(x)||'+-*/'.includes(x))e.value+=x}
function toggleTheme(){document.body.classList.toggle('light');if(document.body.classList.contains('light')){document.documentElement.style.setProperty('--glass','rgba(245,247,255,.82)');document.documentElement.style.setProperty('--text','#151927');document.documentElement.style.setProperty('--muted','#5d6678');toast('Modo claro ativado')}else{document.documentElement.style.setProperty('--glass','rgba(12,18,30,.72)');document.documentElement.style.setProperty('--text','#f7f8fc');document.documentElement.style.setProperty('--muted','#aab3c5');toast('Modo escuro ativado')}}
function updateClock(){const d=new Date();document.getElementById('clock').innerHTML=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('pt-BR')}
function lucideSafe(){}
renderDesktop();renderStart();renderTasks();updateClock();setInterval(updateClock
